<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SNOWFALL</title>
    <!-- boot.js стоит первым модулем в head намеренно: модульные скрипты
         исполняются в порядке документа, а Vite поднимает бандл мира в head.
         Когда boot.js лежал в конце body, мир звал __FTE_BOOT__.ready() раньше,
         чем сторож существовал, и через 30 с живой мир объявлялся не
         загрузившимся. -->
    <script type="module" src="/boot.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>❄️</text></svg>" />
  <!-- ПРЕЛОАДА ЗДЕСЬ БОЛЬШЕ НЕТ, и это результат замера, а не забывчивость.
       Семь link rel=preload на текстуры снега и обе модели (2.2 МБ) стояли тут
       затем, чтобы загрузка началась до разбора JS. fetchpriority="low" был
       попыткой не дать им перебить модуль игры, и она помогала лишь наполовину:
       на 1.5 Мбит/с бандл приезжал на 6559 мс с прелоадом против 2443 мс без
       него, то есть полоса загрузки на четыре секунды дольше «дышала» вслепую,
       не зная долей. Общее время до входа от прелоада не выигрывало ничего:
       27.5-33.7 с в обоих случаях, разброс замеров больше эффекта.
       Причина простая: скачать всё равно надо всё, а порядок решает только то,
       насколько рано появится счётчик. Он появляется с бандлом — значит бандл
       и идёт первым. Тот же вывод и у Winter Tower, только там разница резче. -->
  <style>
    /* ========================================================================
       ОБОЛОЧКА МИРА — одинаковая во всех мирах find-the-end.fun.
       Полоса загрузки, экран входа (он же пауза), выход на витрину. Числа
       в этом блоке общие для всех миров и правятся сразу во всех; своё у
       мира — только палитра ниже и три строки текста в разметке.
       Эталон и правила: docs/games.md, «Единая оболочка мира».
       ======================================================================== */
    :root {
      color-scheme: dark;
      --bg: #04060c;      /* фон мира: тот же цвет, что у неба в кадре */
      --ink: #cfd8ea;     /* основной текст */
      --dim: #7182ad;     /* тихий текст: подписи и тихие ссылки */
      --accent: #ffb163;  /* акцент мира — тот же, что на карточке витрины */
      --edge: rgba(255, 177, 99, 0.45); /* та же краска в рамке кнопки */
      --glow: rgba(255, 177, 99, 0.12); /* и в её подсветке под курсором */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; color: var(--ink);
      /* Игра ведёт себя как приложение, а не как документ: текст здесь не для
         копирования. Без этого зажатая мышь тянет по меню полосу выделения,
         а долгое касание вызывает лупу и «скопировать». Раньше это стояло
         только у body.touch-mode — то есть чинило телефон и не чинило мышь. */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }

    /* Экран входа он же заставка он же пауза: ОДИН экран на всё.
       Раньше их было два - заставка с полосой поверх и меню под ней, - и
       переключение между ними читалось как щелчок. Хуже того, меню открывалось
       только по первому кадру мира, то есть ждало сборки, а нажатие до неё
       пропадало впустую.
       Теперь экран входа показывается сразу, ещё до того как мир начал
       собираться. Полоса живёт под кнопкой и тает, когда мир готов; нажать
       можно в любой момент - нажатие подхватит boot.js и передаст миру, как
       только тот встанет на ноги. */
    #gate {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(4, 8, 14, 0.62);
      backdrop-filter: blur(6px);
      transition: opacity 0.5s ease;
      /* Первое появление - мягкое: витрина гаснет полсекунды, и титул мира
         проступает ей навстречу, а не выпрыгивает готовым. */
      animation: gate-in 0.7s ease both;
    }
    @keyframes gate-in { from { opacity: 0; } to { opacity: 1; } }
    #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Кегль ведёт себя от ширины экрана осторожно: имя мира — одно длинное
       слово с большим трекингом, и на 360 px оно упиралось в края. */
    #gate h1 {
      max-width: 100%; padding: 0 1rem;
      font-size: clamp(1.5rem, 5.4vw, 4.6rem); font-weight: 200;
      letter-spacing: 0.4em; text-indent: 0.4em; text-align: center;
      text-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }
    /* Строка настроения — та же, что на карточке этого мира на витрине. */
    #gate .mood {
      margin-top: 1.1rem; padding: 0 1.5rem;
      font-size: 0.9rem; letter-spacing: 0.06em; color: var(--dim); text-align: center;
    }
    .btn {
      margin-top: 3rem; padding: 0.9rem 3.2rem;
      font: inherit; font-size: 0.95rem;
      letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
      color: var(--ink); background: transparent;
      border: 1px solid var(--edge); border-radius: 2px;
      cursor: pointer; transition: all 0.25s ease;
    }
    .btn:hover { background: var(--glow); border-color: var(--accent); }
    .btn:focus-visible, .quiet:focus-visible, #exit:focus-visible, .tbtn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 4px;
    }

    /* Нажали раньше, чем мир собрался: кнопка не отказывает, а принимает и
       ждёт. Мир войдёт сам, как только встанет (boot.js держит намерение). */
    .btn.waiting {
      color: var(--dim); border-color: rgba(140, 165, 205, 0.25);
      cursor: default; pointer-events: none;
    }
    .btn.waiting:hover { background: transparent; }

    /* --- полоса под кнопкой ---
       Пока мир собирается, она под кнопкой; когда собрался - тает. Прежде
       полоса жила на отдельном экране поверх меню, и переход между экранами
       и был тем самым рывком. */
    #boot {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      margin-top: 1.8rem; height: 2px;
      transition: opacity 0.7s ease;
    }
    body.ready #boot { opacity: 0; }

    /* Пока модуль игры не разобран, о долях ничего не известно - полоса просто
       «дышит» на CSS-анимации, без единой строчки JS. Как только main.js
       начинает считать ресурсы, он вешает .known и ведёт ширину сам. */
    #loadBar {
      position: relative; overflow: hidden;
      width: min(300px, 48vw); height: 2px;
      background: rgba(140, 165, 205, 0.14);
    }
    #loadFill {
      position: absolute; top: 0; bottom: 0; left: -34%; width: 34%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: drift 1.7s ease-in-out infinite;
    }
    @keyframes drift { to { left: 100%; } }
    #loadBar.known #loadFill {
      animation: none; left: 0; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--ink));
      transition: width 0.35s ease;
    }

    /* Мир не собрался: полоса врёт о продолжении, и её не остаётся. Остаётся
       строка и кнопка «повторить» (обе ставит boot.js). */
    #bootMsg {
      max-width: 22rem; text-align: center; line-height: 1.7;
      font-size: 0.8rem; letter-spacing: 0.08em; color: var(--dim);
    }
    body.boot-failed #loadBar { display: none; }
    body.boot-failed #boot { height: auto; }
    /* Пока мир не собрался, входить некуда: кнопка входа уступает место
       кнопке «повторить». */
    body.boot-failed #enter { display: none; }

    /* Тихие ссылки под кнопкой: выход из мира и всё, что мир добавит от себя. */
    .quiet {
      margin-top: 1.8rem;
      font: inherit; font-size: 0.68rem;
      letter-spacing: 0.28em; text-indent: 0.28em; text-transform: uppercase;
      color: var(--dim); opacity: 1; text-decoration: none;
      background: transparent; border: none; cursor: pointer;
      transition: opacity 0.25s ease, color 0.25s ease;
    }
    .quiet:hover { opacity: 1; color: var(--ink); }

    /* Выход на витрину. В самой игре его в кадре нет: стрелка появляется
       только когда курсор свободен — на экране входа и на паузе. */
    #exit {
      position: fixed; z-index: 11;
      top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    body.paused #exit { opacity: 0.45; pointer-events: auto; }
    #exit:hover { opacity: 1; }
    #exit svg {
      width: 20px; height: 20px; fill: none; stroke: var(--ink);
      stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
    }

    /* =================== дальше — своё этого мира ========================= */

    /* сброс памяти мира — тихая кнопка, подтверждение вторым нажатием */
    #resetWorld { margin-top: 1.1rem; }
    #resetWorld.arm { color: #d98a6a; opacity: 1; }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 4, 12, 0.62) 100%);
    }

    /* --- подсказка у двери ---
       Единственный текст, который остаётся в кадре, и то у самого объекта.
       Уйдёт вместе с переходом на интуитивное управление (ROADMAP витрины). */
    #prompt {
      position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
      z-index: 6; pointer-events: none;
      font-size: 0.85rem; letter-spacing: 0.22em; color: rgba(215, 225, 245, 0.85);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
      opacity: 0; transition: opacity 0.35s ease;
    }
    #prompt.show { opacity: 1; }

    /* --- изморозь при замерзании ---
       Полос и градусов на экране нет: холод игрок читает по краям кадра,
       по дыханию и по раскачке бега. */
    #frost {
      position: fixed; inset: 0; z-index: 7; pointer-events: none;
      opacity: 0; transition: opacity 1.5s ease;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(165, 195, 250, 0.22) 68%, rgba(214, 230, 255, 0.6) 100%),
        radial-gradient(ellipse at center, transparent 55%, rgba(230, 242, 255, 0.35) 100%);
    }

    /* --- смерть от холода --- */
    #death {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(3, 4, 10, 0.92);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 3.5s ease, visibility 0s linear 3.5s;
    }
    #death.show { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
    #death h2 {
      font-size: clamp(1.6rem, 4.5vw, 3rem); font-weight: 200;
      letter-spacing: 0.5em; text-indent: 0.5em; color: #b9c9ea;
    }
    #death p { margin-top: 1rem; font-size: 0.8rem; letter-spacing: 0.3em; color: var(--dim); }

    /* На таче pointer lock не используется, а значит нет и паузы, на которой
       стрелка выхода появляется сама: там она висит всегда и тусклее — иначе
       из мира не выйти ничем, кроме кнопки «назад» браузера. */
    body.touch-mode #exit { opacity: 0.35; pointer-events: auto; }

    /* --- тач-управление (создаётся из touch.js только на тач-устройствах) ---
       без видимых джойстиков; кнопки — голые белые штрихи, никаких подложек */
    #touchUI { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; }
    #touchUI.on { display: block; }
    .tbtn {
      position: fixed; width: 68px; height: 68px; padding: 0;
      pointer-events: auto; background: transparent; border: none;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.5; transition: opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .tbtn:active { opacity: 1; }
    .tbtn.hide { display: none; }
    .tbtn svg {
      width: 34px; height: 34px; fill: none; stroke: #e8eefb;
      stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 7px rgba(0, 0, 0, 0.75));
    }
    #tbJump { right: max(20px, env(safe-area-inset-right)); bottom: 32px; }
    #tbAct { right: max(20px, env(safe-area-inset-right)); bottom: 116px; }
    #tbTool1 { right: max(102px, calc(env(safe-area-inset-right) + 82px)); bottom: 32px; }
    #tbTool2 { right: max(102px, calc(env(safe-area-inset-right) + 82px)); bottom: 116px; }
    body.touch-mode, body.touch-mode canvas {
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #loadFill { animation: none; left: 0; }
      #gate, #boot, #death, #frost, #prompt, .tbtn, #exit { transition: none; }
      #gate { animation: none; backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <div id="vignette"></div>

  <a id="exit" href="https://find-the-end.fun/" aria-label="Выйти на витрину">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
  </a>

  <!-- Экран входа виден СРАЗУ, без ожидания мира: ни class="hidden", ни inert.
       Мир собирается за ним и проступает сквозь него по мере готовности. -->
  <div id="gate">
    <h1>SNOWFALL</h1>
    <p class="mood">Минус четырнадцать. Свет в окне горит не для тебя.</p>
    <button id="enter" class="btn" type="button" data-resume="продолжить">войти в ночь</button>
    <div id="boot" role="status" aria-live="polite">
      <div id="loadBar" role="progressbar" aria-label="Мир собирается"><div id="loadFill"></div></div>
      <p id="bootMsg" hidden></p>
    </div>
    <a class="quiet" href="https://find-the-end.fun/">выйти из мира</a>
    <button id="resetWorld" class="quiet" type="button">начать ночь заново</button>
  </div>

  <div id="prompt"></div>

  <div id="frost"></div>

  <div id="death" role="alertdialog" aria-modal="true" aria-labelledby="death-title" inert aria-hidden="true">
    <h2 id="death-title">ВЫ ЗАМЁРЗЛИ</h2>
    <p>ночь оказалась длиннее вас</p>
    <button id="retry" class="btn" type="button">ещё раз</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
